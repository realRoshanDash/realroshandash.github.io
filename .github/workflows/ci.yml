# Test, type-check and build every push and pull request.
# Pushes to master also deploy dist/ to GitHub Pages, which serves roshandash.com.
name: CI

on:
  push:
  pull_request:
  # Re-run by hand from the Actions tab, e.g. to redeploy Pages without a new commit.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the stale run. master is never cancelled,
# so a deploy that has started always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npx astro check
      - run: npm run build

      # Reminder only, never fails the build: security.txt must not go stale (RFC 9116).
      - name: Check security.txt expiry
        run: |
          node -e '
            const txt = require("node:fs").readFileSync("public/.well-known/security.txt", "utf8");
            const days = Math.floor((new Date(/^Expires:\s*(.+)$/m.exec(txt)?.[1]) - Date.now()) / 864e5);
            if (!(days > 30)) console.log(`::warning file=public/.well-known/security.txt::Expires in ${days} days; move Expires a year ahead.`);
          '

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # Dot-folders are skipped by default; this keeps .well-known/security.txt.
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
