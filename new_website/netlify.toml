# Compatibility shim — Netlify's UI "Base directory" still points at new_website/ from the
# 2021 VuePress site. Netlify reads the netlify.toml in the base directory, so this one
# builds the real project at the repo root and publishes its output from here.
# Delete this folder after clearing "Base directory" in Netlify → Site configuration → Build & deploy.
[build]
  command = "cd .. && npm ci --no-audit --no-fund && npm run build && rm -rf new_website/dist && cp -R dist new_website/dist"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
