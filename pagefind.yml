# Pagefind (site search for the ⌘K palette), run by `npm run build` after `astro build`.
# Base.astro marks <main> with data-pagefind-body, so header, footer and palette stay out of the index.
# Decorative markup that screen readers skip is skipped by search too: column rulers, section numerals,
# separators, the empty-state dashes, the gate's readout. Pagefind ignores the `hidden` attribute and CSS, so
# hidden controls are listed here, as are buttons (their labels are UI, not content: "Copy", "Cancel"…), the
# contact gate's instrument panel and the locked email row.
exclude_selectors:
  - '[aria-hidden="true"]'
  - '[hidden]'
  - 'button'
  - '.gate'
  - '[data-email-row]'
