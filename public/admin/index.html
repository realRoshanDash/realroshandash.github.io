<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Content manager · Roshan Dash</title>
    <!-- Absolute config path, so /admin, /admin/ and /admin/index.html all load the same file. -->
    <link rel="cms-config-url" href="/admin/config.yml" type="application/yaml" />
  </head>
  <body>
    <noscript>The content manager needs JavaScript.</noscript>
    <!-- Sveltia CMS (https://sveltiacms.app), pinned to one exact version. The integrity hash makes the
         browser refuse the script if unpkg ever serves different bytes. To upgrade, see README.md →
         Publishing → A. A classic script, not type="module", as the Sveltia docs require. -->
    <script
      src="https://unpkg.com/@sveltia/cms@0.261.0/dist/sveltia-cms.js"
      integrity="sha384-sty7BGmg7YGd6Wi3G73SvUYWcNE6vztGSEklT7ZI8T/3JSshWKHKH7HuUk99s/HJ"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
