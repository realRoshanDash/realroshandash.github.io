# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0/schema/sveltia-cms.json
#
# Sveltia CMS for roshandash.com, served at /admin/. Docs: https://sveltiacms.app/en/docs
# Every save is a commit to master, and GitHub Actions deploys each commit to GitHub Pages.
#
# The collections mirror src/content.config.ts (blog, trades, notes): same field names, same
# rules. Change the schema there first, then here. Each entry is a page bundle
# (<slug>/index.md) with its images in the same folder, referenced by bare file name
# (cover: photo.webp), so Astro's image() helper finds and optimises them.

backend:
  name: github
  repo: roshandash411/roshandash411.github.io
  branch: master
  # Sign in with a fine-grained personal access token (README.md → "Publishing").
  # OAuth would need an extra auth server, so it's off.
  auth_methods: [token]
  commit_messages:
    create: 'content: add {{collection}} {{slug}}'
    update: 'content: update {{collection}} {{slug}}'
    delete: 'content: delete {{collection}} {{slug}}'
    uploadMedia: 'content: upload {{path}}'
    deleteMedia: 'content: delete {{path}}'

app_title: Roshan Dash · CMS
site_url: https://roshandash.com
display_url: https://roshandash.com
logo:
  # Sign-in screen and tab icon. Must be a stable public path (a file in public/).
  src: /favicon.svg

# Library for files that don't belong to an entry. Entry images go in the entry's folder.
media_folder: public/uploads
public_folder: /uploads

media_libraries:
  default:
    config:
      max_file_size: 20971520 # 20 MB
      # "IMG 1234 (1).JPG" → "img-1234-1.webp". Spaces would break Markdown image links.
      slugify_filename: true
      # Shrink phone photos before they're committed (Astro re-optimises at build time anyway).
      # HEIC has to be converted because the build's image pipeline (sharp) can't read it.
      # PNGs (chart screenshots) are left as they are.
      transformations:
        jpeg: { format: webp, quality: 85, width: 2400, height: 2400 }
        heic: { format: webp, quality: 85, width: 2400, height: 2400 }

slug:
  encoding: ascii
  clean_accents: true
  maxlength: 80
  # {{year}}…{{minute}} in slug templates use the editor's local time (Singapore), not UTC.
  timezone: local

output:
  # Leave empty optional fields out of the front matter. Astro's schema rejects '' and
  # null (e.g. `exit: null`, `link: ''`), but it accepts a missing key.
  omit_empty_optional_fields: true

editor:
  # Unstyled preview next to the editor (site CSS isn't loaded), for proof-reading.
  preview: true

collections:
  # ── Writing ──────────────────────────────────────────────────────────────────────────────
  - name: blog
    label: Writing
    label_singular: Post
    description: Long-form posts. New posts start as drafts; turn Draft off to publish.
    icon: edit_note
    folder: src/content/blog
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    extension: md
    format: yaml-frontmatter
    slug:
      template: '{{slug}}'
      editable: [create] # renaming a published post would break its URL
    preview_path: 'blog/{{slug}}/'
    aliases_field: false
    summary: '{{title}}'
    sortable_fields:
      fields: [published, title]
      default: { field: published, direction: descending }
    view_filters:
      filters:
        - { name: drafts, label: Drafts, field: draft, pattern: true }
        - { name: live, label: Published, field: draft, pattern: false }
        - { name: featured, label: Featured, field: featured, pattern: true }
    fields:
      - { name: title, label: Title, widget: string, maxlength: 140 }
      - name: description
        label: Description
        widget: text
        maxlength: 300
        hint: One or two sentences. Shown in lists, feeds and link previews.
      - { name: published, label: Published, widget: datetime, type: date, default: '{{now}}' }
      - name: updated
        label: Updated
        widget: datetime
        type: date
        required: false
        hint: Set when you revise a published post.
      - { name: tags, label: Tags, widget: list, required: false, hint: 'Lowercase, e.g. `productivity`, `tools`.' }
      - name: cover
        label: Cover image
        widget: image
        required: false
        choose_url: false
        hint: Stored next to the post. Used at the top of the post and in link previews.
      - { name: coverAlt, label: Cover alt text, widget: string, required: false, hint: 'Describe the cover image for screen readers.' }
      - { name: featured, label: Featured, widget: boolean, default: false, required: false }
      - { name: draft, label: Draft, widget: boolean, default: true, required: false, hint: 'Drafts are not built or listed anywhere.' }
      - name: body
        label: Body
        widget: markdown
        # Raw Markdown first, so callouts and code-block options are saved exactly as typed.
        modes: [raw, rich_text]
        hint: 'Callouts: `> [!NOTE]`, `> [!TIP]`, `> [!WARNING]`. Uploaded images are stored next to the post.'

  # ── Trade ideas ──────────────────────────────────────────────────────────────────────────
  - name: trades
    label: Trade ideas
    label_singular: Trade idea
    description: 'Lifecycle: watching → active → closed or stopped (invalidated if it never triggers). The site adds the not-financial-advice disclaimer.'
    icon: candlestick_chart
    folder: src/content/trades
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    extension: md
    format: yaml-frontmatter
    slug:
      template: '{{year}}-{{month}}-{{day}}-{{fields.ticker}}-{{fields.direction}}' # 2026-11-07-nvda-long
      editable: [create]
    preview_path: 'trades/{{slug}}/'
    aliases_field: false
    summary: '{{ticker | upper}} {{direction}} · {{setup}} · {{status}}'
    sortable_fields:
      fields: [published, ticker, status]
      default: { field: published, direction: descending }
    view_filters:
      filters:
        - { name: open, label: Open (watching or active), field: status, pattern: '^(watching|active)$' }
        - { name: done, label: Finished, field: status, pattern: '^(closed|stopped|invalidated)$' }
        - { name: drafts, label: Drafts, field: draft, pattern: true }
    view_groups:
      groups:
        - { name: status, label: Status, field: status }
        - { name: direction, label: Direction, field: direction }
    fields:
      - { name: title, label: Title, widget: string, maxlength: 140, hint: 'e.g. "NVDA: base breakout above 140".' }
      - { name: summary, label: Summary, widget: text, maxlength: 300, hint: 'The thesis in one or two sentences.' }
      - name: ticker
        label: Ticker
        widget: string
        maxlength: 15
        pattern: ['^[A-Za-z0-9.\-^=!]{1,15}$', 'Use 1–15 letters, digits or . - ^ = !']
        hint: e.g. NVDA or BRK.B (shown in capitals).
      - { name: exchange, label: Exchange, widget: select, options: [NASDAQ, NYSE, AMEX, CBOE, OTC, CRYPTO, OTHER], default: NASDAQ }
      - name: tvSymbol
        label: TradingView symbol
        widget: string
        required: false
        hint: Only if EXCHANGE:TICKER isn't right for TradingView, e.g. `NYSE:BRK.B` or `BINANCE:BTCUSDT`.
      - { name: direction, label: Direction, widget: select, options: [long, short] }
      - name: setup
        label: Setup
        widget: select
        options:
          - Breakout
          - Episodic pivot
          - Pullback
          - Base breakout
          - Flag
          - 'Gap & go'
          - Parabolic short
          - Range
          - Earnings
          - Reversal
          - Other
      - { name: timeframe, label: Timeframe, widget: select, options: [intraday, swing, position], default: swing }
      - name: status
        label: Status
        widget: select
        options: [watching, active, closed, stopped, invalidated]
        default: watching
        hint: 'watching → **active** once the entry fills → **closed** (exited) or **stopped**. **invalidated**: never triggered.'
      - { name: published, label: Published, widget: datetime, type: date, default: '{{now}}' }
      - { name: updated, label: Updated, widget: datetime, type: date, required: false }
      - { name: entry, label: Entry, widget: number, value_type: float, min: 0, hint: "Per share, in the instrument's quote currency." }
      - { name: stop, label: Stop, widget: number, value_type: float, min: 0, hint: 'Long → below the entry. Short → above it.' }
      - name: targets
        label: Targets
        label_singular: Target
        widget: list
        min: 1
        max: 5
        field: { name: target, label: Target, widget: number, value_type: float, min: 0 }
        hint: 1–5 prices, nearest first. Long → above the entry. Short → below it.
      - name: triggered
        label: Triggered
        widget: datetime
        type: date
        required: false
        hint: When the entry filled (watching → active). Stats use Published if this is empty.
      - name: exit
        label: Exit
        widget: number
        value_type: float
        min: 0
        required: false
        hint: Average exit price. Required once the idea is closed or stopped (it sets the R result).
      - { name: closed, label: Closed, widget: datetime, type: date, required: false }
      - { name: conviction, label: Conviction, widget: number, value_type: int, min: 1, max: 5, required: false, hint: '1 (low) to 5 (high).' }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: chart, label: Chart image, widget: image, required: false, choose_url: false, hint: 'Chart screenshot, stored next to the idea.' }
      - { name: chartAlt, label: Chart alt text, widget: string, required: false }
      - name: updates
        label: Updates
        label_singular: Update
        widget: list
        required: false
        summary: '{{fields.date}} · {{fields.note}}'
        fields:
          - { name: date, label: Date, widget: datetime, type: date, default: '{{now}}' }
          - { name: note, label: Note, widget: text }
      - { name: draft, label: Draft, widget: boolean, default: true, required: false, hint: 'Drafts are not built or listed anywhere.' }
      - { name: body, label: Write-up, widget: markdown, modes: [raw, rich_text], hint: 'Thesis, plan, risks. Callouts: `> [!NOTE]`.' }

  # ── Notes ────────────────────────────────────────────────────────────────────────────────
  - name: notes
    label: Notes
    label_singular: Note
    description: 'Short-form: market notes, TILs, links, a photo with a caption. The title is optional.'
    icon: sticky_note_2
    folder: src/content/notes
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    extension: md
    format: yaml-frontmatter
    slug:
      # Notes often have no title, so the slug is the creation time, e.g. 2026-11-07-1532.
      # You can type a nicer slug when you create the note.
      template: '{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}'
      editable: [create]
    preview_path: 'notes/{{slug}}/'
    aliases_field: false
    summary: "{{title | default('Untitled note')}} · {{published | date('YYYY-MM-DD HH:mm')}}"
    sortable_fields:
      fields: [published, title]
      default: { field: published, direction: descending }
    view_filters:
      filters:
        - { name: drafts, label: Drafts, field: draft, pattern: true }
        - { name: live, label: Published, field: draft, pattern: false }
    fields:
      - { name: title, label: Title, widget: string, required: false, maxlength: 140 }
      - name: published
        label: Published
        widget: datetime
        default: '{{now}}'
        # Stored with its offset (2026-11-07T15:32:00+08:00), so the build server's
        # timezone can't shift it.
        input_timezone: Asia/Singapore
        hint: Singapore time.
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: image, label: Image, widget: image, required: false, choose_url: false, hint: 'Stored next to the note.' }
      - { name: imageAlt, label: Image alt text, widget: string, required: false }
      - { name: link, label: Link, widget: string, type: url, required: false, hint: 'The page this note is about, if any.' }
      - { name: draft, label: Draft, widget: boolean, default: true, required: false, hint: 'Drafts are not built or listed anywhere.' }
      - { name: body, label: Body, widget: markdown, required: false, modes: [raw, rich_text] }
